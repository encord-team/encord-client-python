name: 'Run integration tests'
description: 'Run the integration tests for a given Python version. These tests come from the cord-backend.'

inputs:
  python-version:
    description: 'Python version to use'
    default: 3.13
    required: false
  test-report-file:
    description: 'File name to save the test report in'
    required: false
    default: integration-test-report-python3_13.xml
  private-key:
    description: 'Private key for integration tests'
    required: true
  private-key-non-org:
    description: 'Private key of the second (non-org) user for integration tests'
    required: true
  private-key-service-account:
    description: 'Private key for service account user for integration tests'
    required: true
  robot-account-email:
    description: 'Email of the robot account for integration tests'
    required: true
  robot-account-password:
    description: 'Password of the robot account for integration tests'
    required: true
  google-credentials:
    description: 'Server accounts credentials to get docker artifacts'
    required: true
  private-key-local-docker:
    description: 'PRIVATE_KEY_LOCAL_DOCKER for dotenvx'
    required: true
  backend-repo-location:
    description: 'backend repo location'
    default: ./encord-backend
    required: false
  integration-tests-location:
    description: 'relative to the backend repo'
    default: projects/sdk-integration-tests
    required: false
  test-dir:
    description: 'Test directory of the integration tests project.'
    default: ./src/sdk_integration_tests/tests
    required: false
  environment:
    description: 'Encord deployment to run tests'
    default: DEV
    required: false
  sdk-repository-url:
    description: 'Git URL to the Encord SDK repository'
    default: https://github.com/encord-team/encord-client-python
    required: false


runs:
  using: "composite"

  steps:
    - name: Set up Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.google-credentials }}

    - name: Configure Docker for Artifact Registry
      run: gcloud --quiet auth configure-docker europe-west2-docker.pkg.dev
      shell: bash

    - name: Provide dotenvx decryption key
      shell: bash
      working-directory: ${{ inputs.backend-repo-location }}
      env:
        DOTENV_PRIVATE_KEY_LOCAL_DOCKER: ${{ inputs.private-key-local-docker }}
      run: printf 'DOTENV_PRIVATE_KEY_LOCAL_DOCKER="%s"\n' "$DOTENV_PRIVATE_KEY_LOCAL_DOCKER" > .env.keys

    - name: Spin up api server docker
      id: backend
      shell: bash
      run: |
        cores=$(nproc)
        export CELERY_WORKERS=$(( cores / 2 > 4 ? cores / 2 : 4 ))
        bash e2e.sh up -d --wait
      working-directory: ${{ inputs.backend-repo-location }}/local-dev

    - name: Setup uv environment
      uses: ./.github/actions/setup-uv-environment
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup FFMPEG
      uses: FedericoCarboni/setup-ffmpeg@v2

    - name: Run tests
      env:
        ENCORD_URL: http://127.0.0.1:6969
      run: |
        cd ${{ inputs.backend-repo-location }}/${{ inputs.integration-tests-location }}
        export PRIVATE_KEY="${{ inputs.private-key }}"
        export PRIVATE_KEY_SERVICE_ACCOUNT="${{ inputs.private-key-service-account }}"
        export PRIVATE_KEY_NON_ORG='${{ inputs.private-key-non-org }}'
        export ROBOT_ACCOUNT_EMAIL='${{ inputs.robot-account-email }}'
        export ROBOT_ACCOUNT_PASSWORD='${{ inputs.robot-account-password }}'
        export CORD_ENV="${{ inputs.environment }}"
        uv sync
        uv add git+${{ inputs.sdk-repository-url }}
        source .venv/bin/activate
        pytest --timeout=600 -n auto ${{ inputs.test-dir }} --rootdir=${{ inputs.test-dir }} --verbose --junitxml=${{ inputs.test-report-file }}
      shell: bash

    - name: Upload report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ${{ inputs.test-report-file }}
        path: ${{ inputs.backend-repo-location }}/${{ inputs.integration-tests-location }}/${{ inputs.test-report-file }}

    - name: Publish integration test report Python ${{ inputs.python-version }}
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: ${{ inputs.backend-repo-location }}/${{ inputs.integration-tests-location }}/${{ inputs.test-report-file }}
        check_name: SDK integration test report

    - name: Dump backend logs on failure
      if: ${{ failure() && (steps.backend.outcome == 'failure' || steps.backend.outcome == 'success') }}
      shell: bash
      working-directory: ${{ inputs.backend-repo-location }}/local-dev
      run: |
        bash e2e.sh ps -a
        bash e2e.sh logs --no-color
