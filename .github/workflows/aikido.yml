on:
  schedule:
    - cron: '00 11 * * *'
  workflow_dispatch:
name: Aikido Scan
jobs:
  aikido-local-scan-repo:
    runs-on: ubuntu-latest
    container:
      image: aikidosecurity/local-scanner:v1.0.52
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run scan
        env:
          AIKIDO_API_KEY: ${{ secrets.AIKIDO_API_Key }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: aikido-local-scanner scan ./ --apikey "$AIKIDO_API_KEY" --repositoryname "$REPOSITORY_NAME" --branchname "$DEFAULT_BRANCH"
