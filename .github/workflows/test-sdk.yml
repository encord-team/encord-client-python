name: Test SDK

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: cord-client-${{ github.ref }}-test
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run unit tests
        uses: ./.github/actions/run-unit-tests
        with:
          python-version: ${{ matrix.python }}
          test-report-file: unit-test-report-python${{ matrix.python }}.xml


  send-slack-notification:
    name: Send notification
    runs-on: ubuntu-24.04
    needs: [ unit-tests ]
    if: always()
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get workflow status
        uses: technote-space/workflow-conclusion-action@v3

      - name: Send Slack notification
        uses: ./.github/actions/send-slack-notification
        with:
          success-parameter: ${{ env.WORKFLOW_CONCLUSION }}
          failure-channel: ${{ secrets.SLACK_FAILURE_CHANNEL_ID }}
