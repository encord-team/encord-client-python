name: SDK PR report

on:
  pull_request:
    branches:
      - master

env:
  PYTHON_VERSION: 3.9

concurrency:
  group: cord-client-${{ github.ref }}-pr
  cancel-in-progress: true

jobs:
  formatting:
    name: Linting and type checking
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup uv environment
        uses: ./.github/actions/setup-uv-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run linting, type checking and testing
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: "--all-files --hook-stage=push"

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run unit tests
        uses: ./.github/actions/run-unit-tests
        with:
          python-version: ${{ matrix.python }}
          test-report-file: unit-test-report-python${{ matrix.python }}.xml
